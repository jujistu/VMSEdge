name: VMS verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
      - run: npm ci --prefix backend
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npm run build --prefix backend
      - run: npm test --prefix backend
      - run: docker run -d --name vms-test -p 27028:27028 mongo:8.0 mongod --replSet vms-test --bind_ip_all --port 27028
      - run: |
          for i in $(seq 1 30); do
            docker exec vms-test mongosh --port 27028 --quiet --eval 'db.adminCommand({ping:1}).ok' && break
            sleep 1
          done
      - run: npm run test:e2e --prefix backend
      - run: pnpm lint && pnpm typecheck && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
